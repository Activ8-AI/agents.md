name: Governor Failover

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Governor Watchdog
    types:
      - completed

jobs:
  failover:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4.1.0
      - uses: actions/setup-python@v4.7.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-charter.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-charter.txt
      - name: Run resilient governor runner
        env:
          PAT_ACTIV8_AI: ${{ secrets.PAT_ACTIV8_AI }}
          PAT_LMA: ${{ secrets.PAT_LMA }}
          PAT_PERSONAL: ${{ secrets.PAT_PERSONAL }}
        run: python resilient_governor_runner.py --targets activ8 lma personal --retries 3 --backoff 1 3 5
